<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image</title>
<!--
  Rendered to public/og.jpg (1200×630) by `npm run og`.
  {{tokens}} are filled from src/config.ts; edit the headline, role line and proof points here.
-->
<style>
@font-face{font-family:'Archivo';src:url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');font-weight:100 900;font-stretch:62% 125%}
:root{--ink:#14171F;--text2:#4A5160;--muted:#636A78;--rule:#D5D9DF;--accent:#C8174F;--paper:#F2F3F5}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{font-family:'Archivo',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:1fr 360px;gap:56px;padding:56px 64px}
.left{display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:650;font-stretch:118%}
.logo{width:44px;height:44px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;font-stretch:125%}
h1{margin-top:44px;font-size:64px;line-height:.98;font-weight:660;font-stretch:125%;letter-spacing:-.035em}
.role{margin-top:22px;font-size:24px;color:var(--text2);line-height:1.35}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding-top:24px;border-top:1px solid var(--rule)}
.proof{display:flex;gap:28px;font-size:19px;font-weight:650}
.proof span{display:flex;align-items:center;gap:9px}
.proof span::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent)}
.url{font-size:19px;color:var(--muted)}
.right{position:relative;border-radius:28px;overflow:hidden;background:#dfe2e6}
.right img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.badge{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;font-size:16px;font-weight:600}
.badge::before{content:'';width:9px;height:9px;border-radius:50%;background:#1f9d55}
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><span class="logo">{{monogram}}</span>{{name}}</div>
    <h1>Websites that load fast and sell harder.</h1>
    <p class="role">Freelance web developer — Next.js, React, Astro, headless CMS, Stripe and AI. Remote, for clients worldwide.</p>
    <div class="foot">
      <div class="proof"><span>8+ years</span><span>40+ projects</span><span>Remote, worldwide</span></div>
      <div class="url">{{host}}</div>
    </div>
  </div>
  <div class="right">
    <img src="../src/assets/portrait.webp" alt="">
    <span class="badge">{{availability}}</span>
  </div>
</body>
</html>
